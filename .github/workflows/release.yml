name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Zip extension
        run: cd dist && zip -r ../pinmix-${{ github.ref_name }}.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: pinmix-*.zip
